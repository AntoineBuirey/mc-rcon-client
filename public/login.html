<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Minecraft RCON Panel</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #121212; color: #e0e0e0; font-family: sans-serif; }
        .card { width: min(420px, calc(100vw - 32px)); background: #1e1e1e; border-radius: 12px; padding: 28px; box-shadow: 0 20px 60px rgba(0,0,0,0.35); }
        h1 { margin-top: 0; color: #fff; font-size: 1.6rem; }
        p { line-height: 1.5; }
        .error { color: #ff8a8a; min-height: 1.4em; }
        label { display: block; margin: 14px 0 6px; }
        input { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #2d2d2d; color: #fff; }
        button { width: 100%; margin-top: 18px; padding: 12px; border: 0; border-radius: 6px; background: #007acc; color: #fff; font-weight: 700; cursor: pointer; }
        button:hover { background: #0063a8; }
        .hint { color: #a0a0a0; font-size: 0.92rem; margin-top: 16px; }
    </style>
</head>
<body>
    <form class="card" method="post" action="/api/login">
        <h1>Connexion Linux requise</h1>
        <p>Authentifiez-vous avec un compte local de la machine pour accéder au panneau RCON.</p>
        <p class="error">__ERROR_MESSAGE__</p>
        <label for="username">Login</label>
        <input id="username" name="username" autocomplete="username" required>
        <label for="password">Mot de passe</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Se connecter</button>
    </form>
</body>
</html>
