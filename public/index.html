<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft RCON Panel</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        h1 { color: #fff; }
        .container { display: flex; gap: 20px; }
        .sidebar { width: 250px; background: #1e1e1e; padding: 15px; border-radius: 8px; }
        .server-btn { display: block; width: 100%; padding: 10px; margin-bottom: 10px; background: #2d2d2d; color: #fff; border: none; border-radius: 4px; cursor: pointer; text-align: left; }
        .server-btn.active { background: #007acc; }
        .main { flex-grow: 1; background: #1e1e1e; padding: 20px; border-radius: 8px; display: flex; flex-direction: column; height: 80vh; }
        #console { flex-grow: 1; background: #000; color: #0f0; padding: 10px; font-family: monospace; overflow-y: auto; border-radius: 4px; margin-bottom: 10px; white-space: pre-wrap; }
        .input-group { display: flex; gap: 10px; }
        input[type="text"] { flex-grow: 1; padding: 10px; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 4px; }
        button.send-btn { padding: 10px 20px; background: #007acc; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Minecraft RCON Panel</h1>
    <div class="container">
        <div class="sidebar" id="server-list">
            <h3>Serveurs</h3>
        </div>
        <div class="main">
            <h2 id="current-server-title">Sélectionnez un serveur</h2>
            <div id="console">Sélectionnez un serveur pour voir la console...</div>
            <div class="input-group">
                <input type="text" id="command-input" placeholder="Entrez une commande (ex: list, say Hello)..." disabled>
                <button class="send-btn" id="send-btn" onclick="sendCommand()" disabled>Envoyer</button>
            </div>
        </div>
    </div>

<script>
    let servers = [];
    let activeServerId = null;
    let commandHistory = [];
    let commandHistoryIndex = -1;
    let currentDraft = '';
    const ws = new WebSocket(`ws://${window.location.host}`);

    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        const consoleDiv = document.getElementById('console');
        if (data.error) {
            consoleDiv.innerText += `\n[Erreur] ${data.error}`;
        } else {
            consoleDiv.innerText += `\n> ${data.response}`;
        }
        consoleDiv.scrollTop = consoleDiv.scrollHeight;
    };

    async function fetchServers() {
        const res = await fetch('/api/servers');
        servers = await res.json();
        const listDiv = document.getElementById('server-list');
        listDiv.innerHTML = '<h3>Serveurs</h3>';
        
        servers.forEach(srv => {
            const btn = document.createElement('button');
            btn.className = 'server-btn';
            btn.innerText = srv.name;
            btn.onclick = () => selectServer(srv.id);
            listDiv.appendChild(btn);
        });
    }

    function selectServer(id) {
        activeServerId = id;
        document.querySelectorAll('.server-btn').forEach((b, idx) => {
            b.classList.toggle('active', idx === id);
        });
        const srv = servers.find(s => s.id === id);
        document.getElementById('current-server-title').innerText = `${srv.name} (${srv.host}:${srv.port})`;
        document.getElementById('command-input').disabled = false;
        document.getElementById('send-btn').disabled = false;
        document.getElementById('console').innerText = `Connecté au contexte RCON de ${srv.name}.`;
    }

    function sendCommand() {
        const input = document.getElementById('command-input');
        const command = input.value.trim();
        if (!command || activeServerId === null) return;

        commandHistory.push(command);
        commandHistoryIndex = commandHistory.length;
        currentDraft = '';
        document.getElementById('console').innerText += `\n$ ${command}`;
        ws.send(JSON.stringify({ serverId: activeServerId, command }));
        input.value = '';
    }

    document.getElementById('command-input').addEventListener('keydown', (e) => {
        const input = e.currentTarget;

        if (e.key === 'Enter') {
            sendCommand();
            return;
        }

        if (e.key === 'ArrowUp') {
            e.preventDefault();

            if (commandHistoryIndex === commandHistory.length) {
                currentDraft = input.value;
            }

            if (commandHistoryIndex > 0) {
                commandHistoryIndex -= 1;
                input.value = commandHistory[commandHistoryIndex];
            }
            return;
        }

        if (e.key === 'ArrowDown') {
            e.preventDefault();

            if (commandHistoryIndex < commandHistory.length - 1) {
                commandHistoryIndex += 1;
                input.value = commandHistory[commandHistoryIndex];
            } else if (commandHistoryIndex === commandHistory.length - 1) {
                commandHistoryIndex = commandHistory.length;
                input.value = currentDraft;
            }
        }
    });

    fetchServers();
</script>
</body>
</html>
