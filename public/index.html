<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft RCON Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Minecraft RCON Panel</h1>
    <div class="container">
        <div class="sidebar">
            <div id="server-list">
                <h3>Serveurs</h3>
            </div>
            <button class="add-server-btn" id="add-server-btn">+ Ajouter un serveur</button>
        </div>
        <div class="main">
            <h2 id="current-server-title">Select a server</h2>
            <div id="console">Select a server to view its console output.</div>
            <div class="input-group">
                <input type="text" id="command-input" placeholder="Entrez une commande (ex: list, say Hello)..." disabled>
                <button class="send-btn" id="send-btn" onclick="sendCommand()" disabled>Send</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="server-modal">
        <div class="modal">
            <button class="modal-close" id="modal-close">&times;</button>
            <h2 id="server-modal-title">Add a new server</h2>

            <form id="server-form">
                <input name="name" type="text" placeholder="Nom du serveur" required>
                <input name="host" type="text" placeholder="Adresse IP ou hostname" required>
                <input name="port" type="number" placeholder="Port RCON" min="1" max="65535" required>
                <input name="password" type="password" placeholder="Mot de passe RCON" required>
                <button type="submit" class="send-btn" id="server-form-submit">Add</button>
            </form>
            <p id="server-form-error"></p>
        </div>
    </div>

<script src="script.js"></script>
</body>
</html>
